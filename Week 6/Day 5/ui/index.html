<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFL Insight</title>
<link rel="icon" type="image/png" href="../logo/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #1d3f72;
    --navy-deep: #16305a;
    --blue-accent: #2f5fa8;
    --ink: #1c2b40;
    --ink-soft: #5b6b82;
    --ink-faint: #8a97ab;
    --bg-top: #eaf1fb;
    --bg-bot: #cfe0f5;
    --card: rgba(255,255,255,0.62);
    --card-solid: #eef4fc;
    --bubble-user: #dbe8fa;
    --track: #dbe3ef;
    --radius-lg: 26px;
    --radius-md: 18px;
    --radius-pill: 999px;
    --shadow-card: 0 20px 45px -18px rgba(29,63,114,0.35), 0 2px 8px rgba(29,63,114,0.06);
    --shadow-soft: 0 10px 30px -14px rgba(29,63,114,0.28);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    min-height:100vh;
    background:
      radial-gradient(1100px 620px at 78% -8%, #f6f9fe 0%, rgba(246,249,254,0) 60%),
      radial-gradient(900px 700px at 8% 30%, #eef4fc 0%, rgba(238,244,252,0) 55%),
      radial-gradient(1200px 800px at 60% 110%, #e2edfb 0%, rgba(226,237,251,0) 50%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
    color: var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- Header ---------- */
  header{
    width:100%;
    max-width:1600px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 26px 44px 18px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand span{ font-size:1.28rem; font-weight:400; color: var(--navy-deep); letter-spacing:0.12em; font-family:'DM Serif Display', Georgia, serif; }

  nav.season{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    font-size:0.92rem; font-weight:600; color: var(--navy); letter-spacing:0.01em;
  }
  nav.season .underline{ width:100%; height:2px; background:var(--navy); border-radius:2px; }

  .menu-btn{
    width:40px; height:40px; border-radius:50%;
    background: rgba(255,255,255,0.55);
    border:1px solid rgba(255,255,255,0.7);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow: var(--shadow-soft);
    position:relative;
  }
  .menu-btn:hover{ background: rgba(255,255,255,0.85); }

  .settings-pop{
    position:absolute; top:52px; right:0; width:300px;
    background: rgba(255,255,255,0.96);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
    padding:16px; display:none; text-align:left; z-index:20;
  }
  .settings-pop.open{ display:block; }
  .settings-pop label{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); font-weight:700; }
  .settings-pop input{
    width:100%; margin-top:6px; margin-bottom:10px; padding:9px 11px;
    border-radius:10px; border:1px solid #d7e1ee; font-size:0.85rem; color:var(--ink);
    background:#f7faff;
  }
  .settings-pop .status{ font-size:0.75rem; color:var(--ink-soft); }
  .settings-pop .status.ok{ color:#1c8a54; }
  .settings-pop .status.bad{ color:#c34141; }
  .settings-pop button{
    margin-top:4px; width:100%; padding:9px; border:none; border-radius:10px;
    background: var(--navy); color:#fff; font-weight:600; font-size:0.82rem; cursor:pointer;
  }

  /* ---------- Main scroll area ---------- */
  main{
    width:100%; max-width:900px; flex:1;
    padding: 18px 20px 200px;
    display:flex; flex-direction:column; gap:26px;
  }

  .empty-state{
    margin-top:14vh; text-align:center; color:var(--ink-faint);
  }
  .empty-state h1{ color:var(--navy-deep); font-size:1.4rem; margin-bottom:8px; }
  .empty-state p{ font-size:0.92rem; }

  /* ---------- User bubble ---------- */
  .row{ display:flex; width:100%; }
  .row.user{ justify-content:flex-end; }
  .bubble-user{
    background: var(--bubble-user);
    color: var(--ink);
    padding:16px 22px;
    border-radius: 22px 22px 4px 22px;
    max-width:70%;
    font-size:0.98rem;
    box-shadow: var(--shadow-soft);
  }

  /* ---------- AI turn ---------- */
  .ai-turn{ display:flex; flex-direction:column; gap:14px; align-items:flex-start; width:100%; }
  .eyebrow{
    display:flex; align-items:center; gap:8px;
    font-size:0.72rem; font-weight:700; letter-spacing:0.09em;
    text-transform:uppercase; color: var(--ink-faint);
  }
  .eyebrow svg{ width:15px; height:15px; }

  .card{
    width:100%; max-width:620px;
    background: var(--card);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.75);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 26px 30px 28px;
  }

  .card-header{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:18px; margin-bottom:18px;
    border-bottom:1px solid rgba(29,63,114,0.12);
  }
  .card-header .title{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.02rem; color:var(--ink); }
  .card-header .title svg{ width:19px; height:19px; color:var(--navy); }
  .confidence-pill{
    font-size:0.74rem; font-weight:700; padding:6px 14px; border-radius: var(--radius-pill);
    background: rgba(29,63,114,0.08); color: var(--navy);
    white-space:nowrap;
  }
  .confidence-pill.med{ background: rgba(198,146,20,0.13); color:#8a6410; }
  .confidence-pill.low{ background: rgba(196,60,60,0.12); color:#a83a3a; }

  .team-row{ display:flex; align-items:flex-end; justify-content:space-between; padding:6px 0; }
  .team-name{ font-size:1.28rem; font-weight:700; color:var(--ink); }
  .team-name.dim{ color:#3c4a5e; }
  .team-code{ font-size:0.72rem; font-weight:700; letter-spacing:0.08em; color:var(--ink-faint); margin-top:3px; }
  .team-pct{ font-size:2.4rem; font-weight:800; color:var(--navy); letter-spacing:-0.02em; }
  .team-pct.dim{ color:#7c8aa0; font-size:2rem; }

  .vs-divider{ display:flex; align-items:center; gap:14px; margin:10px 0; }
  .vs-divider .line{ flex:1; height:1px; background:rgba(29,63,114,0.15); }
  .vs-divider span{ font-size:0.72rem; font-weight:700; letter-spacing:0.08em; color:var(--ink-faint); }

  .prob-track{
    margin-top:20px; height:9px; width:100%; border-radius:999px;
    background: var(--track); overflow:hidden;
  }
  .prob-fill{ height:100%; background: linear-gradient(90deg, var(--navy), var(--blue-accent)); border-radius:999px; transition: width 0.6s ease; }

  .card-note{
    margin-top:16px; font-size:0.74rem; color:var(--ink-faint); line-height:1.5;
  }

  .plain-card{
    width:100%; max-width:640px;
    background: var(--card);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.75);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 22px 26px;
    font-size:0.98rem; line-height:1.6; color:var(--ink);
  }
  .plain-card.refusal{ border-left:3px solid #c98b3b; }
  .plain-card .meta{
    display:block; margin-top:12px; font-size:0.72rem; color:var(--ink-faint);
  }

  .recent-games-table-wrap{ margin-top:18px; overflow-x:auto; }
  .recent-games-table{ width:100%; border-collapse:collapse; font-size:0.8rem; white-space:nowrap; }
  .recent-games-table th{ padding:9px 10px; text-align:left; color:var(--ink-faint); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; border-bottom:1px solid rgba(29,63,114,0.16); }
  .recent-games-table td{ padding:10px; border-bottom:1px solid rgba(29,63,114,0.08); color:var(--ink); }
  .recent-games-table tr:last-child td{ border-bottom:none; }
  .recent-games-table .win{ color:#1c8a54; font-weight:700; }
  .recent-games-table .loss{ color:#b54a4a; font-weight:700; }
  .recent-games-table .draw{ color:#8a6410; font-weight:700; }
  .goal-scorer-list{ display:flex; flex-direction:column; gap:10px; margin-top:4px; }
  .goal-scorer-row{ display:grid; grid-template-columns:32px 1fr auto; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid rgba(29,63,114,0.1); }
  .goal-scorer-row:last-child{ border-bottom:none; }
  .goal-scorer-rank{ color:var(--ink-faint); font-weight:700; }
  .goal-scorer-name{ font-weight:700; color:var(--ink); }
  .goal-scorer-value{ color:var(--navy); font-weight:800; }

  .explanation{ max-width:620px; font-size:0.96rem; line-height:1.65; color:#33445c; }

  .loading{ display:flex; align-items:center; gap:8px; color:var(--ink-faint); font-size:0.9rem; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); animation: pulse 1.1s infinite ease-in-out; }
  .dot:nth-child(2){ animation-delay:0.15s; }
  .dot:nth-child(3){ animation-delay:0.3s; }
  @keyframes pulse{ 0%,80%,100%{ opacity:0.25; transform:scale(0.85);} 40%{ opacity:1; transform:scale(1);} }

  /* ---------- Quick actions + input dock ---------- */
  .dock{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; flex-direction:column; align-items:center;
    padding: 16px 20px 22px;
    background: linear-gradient(180deg, rgba(207,224,245,0) 0%, rgba(207,224,245,0.9) 30%, var(--bg-bot) 60%);
  }
  .dock-inner{ width:100%; max-width:900px; }

  .quick-actions{ display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .pill-btn{
    display:flex; align-items:center; gap:7px;
    background: rgba(255,255,255,0.6);
    border:1px solid rgba(255,255,255,0.8);
    padding:9px 16px; border-radius: var(--radius-pill);
    font-size:0.83rem; font-weight:600; color:var(--ink);
    cursor:pointer; box-shadow: var(--shadow-soft);
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .pill-btn:hover{ background: rgba(255,255,255,0.92); transform: translateY(-1px); }
  .pill-btn svg{ width:15px; height:15px; color: var(--navy); }

  .input-bar{
    display:flex; align-items:center; gap:10px;
    background: rgba(255,255,255,0.72);
    border:1px solid rgba(255,255,255,0.85);
    border-radius: var(--radius-pill);
    padding:8px 8px 8px 8px;
    box-shadow: var(--shadow-card);
  }
  .icon-btn{
    width:42px; height:42px; min-width:42px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: rgba(29,63,114,0.06); border:none; cursor:pointer; color:var(--navy);
  }
  .icon-btn:hover{ background: rgba(29,63,114,0.12); }
  #chat-input{
    flex:1; border:none; background:transparent; outline:none;
    font-size:0.96rem; color:var(--ink); padding:8px 4px;
  }
  #chat-input::placeholder{ color:var(--ink-faint); }
  .send-btn{
    width:42px; height:42px; min-width:42px; border-radius:50%; border:none;
    background: var(--navy); color:#fff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition: background 0.15s ease;
  }
  .send-btn:hover{ background: var(--navy-deep); }
  .send-btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .disclaimer{ margin-top:12px; font-size:0.74rem; color: var(--ink-faint); text-align:center; }

  /* ---------- Reference-inspired neumorphic treatment ---------- */
  :root{
    --navy:#2d5a9e;
    --navy-deep:#1f477f;
    --blue-accent:#477bb9;
    --ink:#2c394b;
    --ink-soft:#4e6278;
    --ink-faint:#71869d;
    --bg-top:#dcecf9;
    --bg-bot:#c2d9ec;
    --card:#d0e4f7;
    --card-solid:#d0e4f7;
    --bubble-user:#d0e4f7;
    --track:#b8cde0;
    --shadow-card:10px 10px 20px #b1c2d2, -10px -10px 20px #ffffff;
    --shadow-soft:6px 6px 12px #b1c2d2, -6px -6px 12px #ffffff;
    font-family:'Geist','Segoe UI',sans-serif;
  }
  body{
    background-image: url("http://localhost:8000/bg%20image/bg%20image.jpg");
    background-position:center;
    background-size:cover;
    background-attachment:fixed;
    font-family:'Geist','Segoe UI',sans-serif;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:-1; opacity:0.34;
    background-image:linear-gradient(115deg, rgba(255,255,255,0.28) 1px, transparent 1px),
      linear-gradient(25deg, rgba(73,117,157,0.08) 1px, transparent 1px);
    background-size:72px 72px, 118px 118px;
  }
  header{
    position:sticky; top:0; z-index:30; max-width:none; height:72px;
    padding:0 max(24px, calc((100vw - 1200px) / 2));
    background:rgba(208,228,247,0.76); backdrop-filter:blur(14px);
  }
  .brand{gap:8px;}
  .brand span{font-size:1.42rem; color:var(--ink); letter-spacing:0.14em; text-transform:uppercase; text-shadow:1px 1px 1px rgba(177,194,210,0.8);}
  .brand span{font-size:1.22rem; color:var(--ink); letter-spacing:0;}
  nav.season{height:100%; justify-content:center; gap:0; color:var(--navy);}
  nav.season .underline{height:2px; margin-top:9px; background:var(--navy);}
  .menu-btn,.pill-btn,.icon-btn,.send-btn{box-shadow:var(--shadow-soft);}
  .menu-btn{background:var(--card); border:none;}
  .menu-btn:hover{background:var(--card); transform:translateY(-1px);}
  .settings-pop{background:var(--card); border:none; box-shadow:var(--shadow-card);}
  .settings-pop input{background:var(--card); border:0; box-shadow:inset 3px 3px 6px #b1c2d2, inset -3px -3px 6px #fff;}
  main{max-width:900px; padding-top:48px; gap:32px;}
  .empty-state{margin-top:14vh;}
  .empty-state h1{font-size:1.5rem; color:var(--ink);}
  .bubble-user,.card,.plain-card{
    background:var(--card); border:none; box-shadow:var(--shadow-card); backdrop-filter:none;
  }
  .bubble-user{border-radius:24px 24px 5px 24px; color:var(--ink);}
  .eyebrow{color:var(--ink-soft); opacity:0.82;}
  .eyebrow svg{color:var(--navy);}
  .card{border-radius:16px; padding:26px 30px 28px;}
  .card-header{border-bottom:2px solid rgba(149,170,191,0.28);}
  .card-header .title{color:var(--ink-soft);}
  .card-header .title svg{color:var(--navy);}
  .confidence-pill{background:var(--card); color:var(--ink); box-shadow:inset 3px 3px 6px #b1c2d2, inset -3px -3px 6px #fff;}
  .team-name{color:var(--ink);}
  .team-pct{color:var(--navy); text-shadow:2px 2px 4px rgba(0,0,0,0.1);}
  .prob-track{background:var(--card); box-shadow:inset 4px 4px 8px #b1c2d2, inset -4px -4px 8px #fff;}
  .prob-fill{background:var(--navy); box-shadow:2px 0 5px rgba(45,90,158,0.4);}
  .explanation{color:var(--ink);}
  .dock{padding:16px 20px 22px; background:linear-gradient(180deg, rgba(194,217,236,0) 0%, rgba(194,217,236,0.88) 30%, #c2d9ec 65%);}
  .dock-inner{max-width:900px;}
  .quick-actions{gap:12px; margin-bottom:12px; overflow-x:auto; flex-wrap:nowrap; padding:4px 4px 8px; scrollbar-width:none;}
  .quick-actions::-webkit-scrollbar{display:none;}
  .pill-btn{background:var(--card); border:none; color:var(--ink-soft); padding:9px 16px; white-space:nowrap;}
  .pill-btn:hover{background:var(--card); transform:translateY(-1px);}
  .pill-btn:active{box-shadow:inset 4px 4px 8px #b1c2d2, inset -4px -4px 8px #fff;}
  .input-bar{background:var(--card); border:none; border-radius:16px; padding:8px; box-shadow:inset 4px 4px 8px #b1c2d2, inset -4px -4px 8px #fff;}
  .icon-btn{background:var(--card); color:var(--ink-soft);}
  .icon-btn:hover{background:var(--card);}
  #chat-input{color:var(--ink); font-family:inherit;}
  .send-btn{border-radius:12px; background:var(--navy);}
  .send-btn:hover{background:var(--navy-deep);}
  .disclaimer{color:var(--ink-soft); opacity:0.65;}
  .recent-games-table th{color:var(--ink-soft);}
  .recent-games-table td{color:var(--ink);}

  @media (max-width:640px){
    header{height:64px; padding:0 18px;}
    nav.season{ display:none; }
    main{padding-top:28px;}
    .card, .plain-card{padding:20px;}
    .team-pct{ font-size:1.9rem; }
    .quick-actions{justify-content:flex-start;}
    .dock{padding-left:12px; padding-right:12px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span>AFL INSIGHT</span>
  </div>
  <nav class="season"><div>CHATBOT</div><div class="underline"></div></nav>
  <div class="menu-btn" id="menu-btn">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#1d3f72" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.4" fill="#1d3f72" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="#1d3f72" stroke="none"/><circle cx="12" cy="19" r="1.4" fill="#1d3f72" stroke="none"/></svg>
    <div class="settings-pop" id="settings-pop">
      <label>API Base URL</label>
      <input id="api-base-input" type="text" value="http://localhost:8000" spellcheck="false">
      <div class="status" id="conn-status">Not checked yet.</div>
      <button id="check-conn-btn">Check connection</button>
    </div>
  </div>
</header>

<main id="chat-log">
  <div class="empty-state" id="empty-state">
    <h1>Ask anything about AFL</h1>
    <p>Match predictions, player stats, head-to-head records, and rules — grounded in real historical data.</p>
  </div>
</main>

<div class="dock">
  <div class="dock-inner">
    <div class="quick-actions">
      <button class="pill-btn" data-prompt="What was Patrick Dangerfield's average disposals in 2020?">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
        Player Stats
      </button>
      <button class="pill-btn" data-prompt="What is Geelong's head to head record against Collingwood?">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        Head to Head
      </button>
    </div>
    <div class="input-bar">
      <button class="icon-btn" id="plus-btn" title="Attachments aren't supported yet">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <input id="chat-input" type="text" placeholder="Ask anything about AFL..." autocomplete="off">
      <button class="send-btn" id="send-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
    <div class="disclaimer">AFL Insight can make mistakes. Verify critical data.</div>
  </div>
</div>

<script>
let API_BASE = "http://localhost:8000";
let conversationId = null;

const chatLog = document.getElementById("chat-log");
const emptyState = document.getElementById("empty-state");
const chatInput = document.getElementById("chat-input");
const sendBtn = document.getElementById("send-btn");
const menuBtn = document.getElementById("menu-btn");
const settingsPop = document.getElementById("settings-pop");
const apiBaseInput = document.getElementById("api-base-input");
const connStatus = document.getElementById("conn-status");

menuBtn.addEventListener("click", (e) => {
  settingsPop.classList.toggle("open");
  e.stopPropagation();
});
document.addEventListener("click", () => settingsPop.classList.remove("open"));
settingsPop.addEventListener("click", (e) => e.stopPropagation());

document.getElementById("check-conn-btn").addEventListener("click", checkConnection);
apiBaseInput.addEventListener("change", () => { API_BASE = apiBaseInput.value.trim().replace(/\/$/, ""); });

async function checkConnection(){
  API_BASE = apiBaseInput.value.trim().replace(/\/$/, "");
  connStatus.textContent = "Checking...";
  connStatus.className = "status";
  try{
    const res = await fetch(`${API_BASE}/health`);
    const data = await res.json();
    connStatus.textContent = `Connected. Models trained: ${data.models_trained}. API key: ${data.google_api_key_configured ? "configured" : "not set (using rule-based router)"}.`;
    connStatus.className = "status ok";
  }catch(err){
    connStatus.textContent = "Could not reach the backend. Is `uvicorn app:app` running at this URL?";
    connStatus.className = "status bad";
  }
}

// -------------------- Team display helpers --------------------
const NICKNAMES = {
  "Geelong Cats": "CATS", "Collingwood Magpies": "MAGPIES", "Sydney Swans": "SWANS",
  "Greater Western Sydney Giants": "GIANTS", "Fremantle Dockers": "DOCKERS",
  "West Coast Eagles": "EAGLES", "Carlton Blues": "BLUES", "Essendon Bombers": "BOMBERS",
  "Richmond Tigers": "TIGERS", "Hawthorn Hawks": "HAWKS", "Melbourne Demons": "DEMONS",
  "North Melbourne Kangaroos": "KANGAROOS", "St Kilda Saints": "SAINTS",
  "Port Adelaide Power": "POWER", "Adelaide Crows": "CROWS", "Gold Coast Suns": "SUNS",
  "Western Bulldogs": "BULLDOGS", "Brisbane Lions": "LIONS", "Brisbane Bears": "BEARS",
};
function nickname(team){
  if(!team) return "";
  if(NICKNAMES[team]) return NICKNAMES[team];
  const words = team.split(" ");
  return words[words.length-1].toUpperCase();
}
function firstName(team){
  if(!team) return "";
  const words = team.split(" ");
  return words.slice(0, -1).join(" ") || team;
}
function confidenceLabel(p){
  const gap = Math.abs(p - 0.5) * 2; // 0..1
  if(gap >= 0.30) return {label:"High", cls:""};
  if(gap >= 0.12) return {label:"Medium", cls:"med"};
  return {label:"Low", cls:"low"};
}

// -------------------- Rendering --------------------
function scrollToBottom(){ window.scrollTo({top: document.body.scrollHeight, behavior:"smooth"}); }

function addUserBubble(text){
  emptyState.style.display = "none";
  const row = document.createElement("div");
  row.className = "row user";
  row.innerHTML = `<div class="bubble-user"></div>`;
  row.querySelector(".bubble-user").textContent = text;
  chatLog.appendChild(row);
  scrollToBottom();
}

function addLoadingTurn(){
  const turn = document.createElement("div");
  turn.className = "ai-turn";
  turn.id = "loading-turn";
  turn.innerHTML = `
    <div class="eyebrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2.5 5.5L9 9l2.5 5.5z"/></svg>
      INSIGHT AI
    </div>
    <div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  chatLog.appendChild(turn);
  scrollToBottom();
  return turn;
}

function eyebrowHtml(){
  return `<div class="eyebrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2.5 5.5L9 9l2.5 5.5z"/></svg>
      INSIGHT AI
    </div>`;
}

function renderMatchPredictionCard(data){
  const home = data.home_team_display, away = data.away_team_display;
  const homePct = Math.round(data.probability_home_win * 100);
  const awayPct = 100 - homePct;
  const leaderIsHome = homePct >= awayPct;
  const conf = data.fixture_note ? {label:"Hypothetical", cls:"med"} : confidenceLabel(data.probability_home_win);

  return `
    <div class="card">
      <div class="card-header">
        <div class="title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 01-10 0V4z"/><path d="M7 5H4a1 1 0 00-1 1v1a4 4 0 004 4M17 5h3a1 1 0 011 1v1a4 4 0 01-4 4"/></svg>
          Match Prediction
        </div>
        <div class="confidence-pill ${conf.cls}">AI Confidence: ${conf.label}</div>
      </div>

      <div class="team-row">
        <div>
          <div class="team-name ${leaderIsHome ? "" : "dim"}">${firstName(home)}</div>
          <div class="team-code">${nickname(home)}</div>
        </div>
        <div class="team-pct ${leaderIsHome ? "" : "dim"}">${homePct}%</div>
      </div>

      <div class="vs-divider"><div class="line"></div><span>VS</span><div class="line"></div></div>

      <div class="team-row">
        <div>
          <div class="team-name ${!leaderIsHome ? "" : "dim"}">${firstName(away)}</div>
          <div class="team-code">${nickname(away)}</div>
        </div>
        <div class="team-pct ${!leaderIsHome ? "" : "dim"}">${awayPct}%</div>
      </div>

      <div class="prob-track"><div class="prob-fill" style="width:${homePct}%"></div></div>
      ${data.fixture_note ? `<div class="card-note">${data.fixture_note}</div>` : ""}
    </div>`;
}

function renderGoalScorerCard(data){
  const predictions = Array.isArray(data.predictions) ? data.predictions.slice(0, 5) : [];
  const rows = predictions.map((item, index) => {
    const valueKey = Object.keys(item).find(key => key.startsWith("predicted_"));
    return `<div class="goal-scorer-row"><div class="goal-scorer-rank">#${index + 1}</div>` +
      `<div class="goal-scorer-name">${escapeHtml(item.player)}</div>` +
      `<div class="goal-scorer-value">${escapeHtml(item[valueKey])} expected goals</div></div>`;
  }).join("");
  return `<div class="card"><div class="card-header"><div class="title">` +
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3z"/></svg>` +
    `Top 5 Goal Scorer Predictions</div><div class="confidence-pill">Expected goals</div></div>` +
    `<div class="goal-scorer-list">${rows}</div></div>`;
}

function renderPlainCard(text, isRefusal){
  const div = document.createElement("div");
  div.className = "plain-card" + (isRefusal ? " refusal" : "");
  div.textContent = text;
  return div.outerHTML;
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[char]));
}

function renderRecentGamesTable(games){
  if(!Array.isArray(games) || !games.length) return "";
  const rows = games.map(game => `
    <tr>
      <td>${escapeHtml(game.season)} / ${escapeHtml(game.round)}</td>
      <td>${escapeHtml(game.date).slice(0, 10)}</td>
      <td>${escapeHtml(game.opponent)}</td>
      <td>${escapeHtml(game.team_score)} - ${escapeHtml(game.opponent_score)}</td>
      <td class="${escapeHtml(game.result)}">${escapeHtml(game.result)}</td>
    </tr>`).join("");
  return `<div class="recent-games-table-wrap"><table class="recent-games-table">
    <thead><tr><th>Season / Round</th><th>Date</th><th>Opponent</th><th>Score</th><th>Result</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

async function sendMessage(text){
  if(!text || !text.trim()) return;
  addUserBubble(text.trim());
  chatInput.value = "";
  sendBtn.disabled = true;
  const loadingTurn = addLoadingTurn();

  let payload;
  try{
    const res = await fetch(`${API_BASE}/chat`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text.trim(), conversation_id: conversationId}),
    });
    if(!res.ok) throw new Error(`Server responded ${res.status}`);
    payload = await res.json();
  }catch(err){
    loadingTurn.innerHTML = eyebrowHtml() + renderPlainCard(
      `Couldn't reach the AFL Insight backend at ${API_BASE}. Make sure "uvicorn api:app" is running, ` +
      `or update the API base URL from the ⋮ menu. (${err.message})`, true);
    sendBtn.disabled = false;
    scrollToBottom();
    return;
  }

  conversationId = payload.conversation_id;
  sendBtn.disabled = false;

  const isRefusal = payload.intent === "off_topic";
  let bodyHtml = "";

  if(payload.intent === "prediction_player" && payload.prediction_metadata &&
     payload.prediction_metadata.prediction_type === "expected_goals (regression)" &&
     Array.isArray(payload.prediction_metadata.predictions)){
    bodyHtml = renderGoalScorerCard(payload.prediction_metadata);
    bodyHtml += `<div class="explanation">${escapeHtml(payload.response)}</div>`;
  }else if(payload.intent === "prediction_match" && payload.prediction_metadata && payload.prediction_metadata.is_prediction){
    const pm = payload.prediction_metadata;
    if(pm.home_team && pm.away_team && pm.probability_home_win != null){
      bodyHtml = renderMatchPredictionCard({
        home_team_display: pm.home_team, away_team_display: pm.away_team,
        probability_home_win: pm.probability_home_win, fixture_note: pm.fixture_note,
      });
      bodyHtml += `<div class="explanation">${payload.response.replace(/This is a model-predicted estimate, not a certainty\.?$/, "").trim()}</div>`;
    }else{
      bodyHtml = renderPlainCard(payload.response, false);
    }
  }else{
    bodyHtml = renderPlainCard(payload.response, isRefusal);
    if(payload.intent === "recent_team_stats" && payload.recent_games){
      bodyHtml += renderRecentGamesTable(payload.recent_games);
    }
  }

  loadingTurn.innerHTML = eyebrowHtml() + bodyHtml;
  scrollToBottom();
}

sendBtn.addEventListener("click", () => sendMessage(chatInput.value));
chatInput.addEventListener("keydown", (e) => { if(e.key === "Enter") sendMessage(chatInput.value); });
document.getElementById("plus-btn").addEventListener("click", () => {
  chatInput.placeholder = "Attachments aren't supported yet — try asking in words instead.";
  setTimeout(() => { chatInput.placeholder = "Ask anything about AFL..."; }, 2500);
});
document.querySelectorAll(".pill-btn").forEach(btn => {
  btn.addEventListener("click", () => sendMessage(btn.dataset.prompt));
});
</script>
